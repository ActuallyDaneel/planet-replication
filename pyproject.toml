[project]
name = "planet-replication"
version = "0.1.0"
description = "Optimized PyTorch port of PlaNet (Hafner et al., 2019) for DM Control cheetah-run"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "dm-control",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
